<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浙江省普通高中学业水平考试成绩查询系统</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .captcha-text { letter-spacing: 0.18em; user-select: none; font-family: 'Courier New', monospace; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
  .shake { animation: shake 0.4s ease; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 0.8s linear infinite; display: inline-block; }
</style>
<script>
  tailwind.config = {
    theme: { extend: { colors: {
      "background":"#f8f9fb","surface-bright":"#f8f9fb","surface":"#f8f9fb",
      "surface-container-lowest":"#ffffff","surface-container-low":"#f2f4f6",
      "surface-container":"#eceef0","surface-container-high":"#e6e8ea",
      "surface-variant":"#e0e3e5","outline-variant":"#c4c6cf","outline":"#74777f",
      "primary":"#002046","primary-container":"#1b365d","on-primary":"#ffffff",
      "on-surface":"#191c1e","on-surface-variant":"#44474e","on-background":"#191c1e",
      "secondary-fixed":"#ffdea5","secondary":"#775a19",
      "error":"#ba1a1a","surface-tint":"#465f88"
    }}}
  }
</script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">

<header class="bg-primary border-b-2 border-secondary-fixed shadow-sm fixed top-0 w-full z-50 flex justify-between items-center px-6 py-4 md:px-16">
  <div class="flex items-center gap-3">
    <span class="material-symbols-outlined text-white text-2xl">school</span>
    <h1 class="font-bold text-white text-sm md:text-lg leading-tight">浙江省普通高中学业水平考试成绩查询系统</h1>
  </div>
</header>

<main class="flex-grow pt-20 pb-12 px-4 md:px-0 flex justify-center items-start">
  <div class="w-full max-w-md mt-8">

    <div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_24px_rgba(0,0,0,0.08)] overflow-hidden">

      <div class="bg-primary px-8 py-6 border-b-2 border-secondary-fixed">
        <h2 class="text-white font-bold text-lg">成绩查询</h2>
        <p class="text-white/65 text-sm mt-1">请输入考生信息进行查询</p>
      </div>

      <div class="p-8 space-y-5">

        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider block">姓名 <span class="text-error normal-case">*</span></label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-xl pointer-events-none">person</span>
            <input id="name" type="text" placeholder="请输入考生姓名"
              class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-bright focus:ring-2 focus:ring-primary/50 focus:border-primary text-on-surface text-sm outline-none transition-all">
          </div>
        </div>

        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider block">准考证号 <span class="text-error normal-case">*</span></label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-xl pointer-events-none">badge</span>
            <input id="examId" type="text" placeholder="请输入准考证号"
              class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-bright focus:ring-2 focus:ring-primary/50 focus:border-primary text-on-surface text-sm outline-none transition-all font-mono tracking-wide">
          </div>
        </div>

        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider block">验证码 <span class="text-error normal-case">*</span></label>
          <div class="flex gap-2 items-center">
            <div class="relative flex-grow">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-xl pointer-events-none">verified_user</span>
              <input id="captcha" type="text" placeholder="请输入验证码" maxlength="4"
                class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-bright focus:ring-2 focus:ring-primary/50 focus:border-primary text-on-surface text-sm outline-none transition-all">
            </div>
            <div id="captchaBox" onclick="refreshCaptcha()" title="点击刷新"
              class="w-28 h-12 bg-surface-container rounded-lg border border-outline-variant flex items-center justify-center cursor-pointer hover:bg-surface-variant transition-colors select-none flex-shrink-0">
              <span id="captchaText" class="captcha-text font-bold text-on-surface text-lg line-through decoration-outline/60 decoration-2"></span>
            </div>
          </div>
        </div>

        <div id="errorBox" class="hidden items-center gap-2 bg-red-50 text-error text-sm px-4 py-3 rounded-lg border border-red-200">
          <span class="material-symbols-outlined text-base flex-shrink-0">error_outline</span>
          <span id="errorText"></span>
        </div>

        <div class="pt-1">
          <button id="submitBtn" onclick="handleQuery()"
            class="w-full bg-primary text-white font-semibold py-3.5 rounded-lg hover:opacity-90 active:scale-[0.98] transition-all shadow-sm flex items-center justify-center gap-2 text-sm">
            <span class="material-symbols-outlined text-xl">search</span>
            查询成绩
          </button>
        </div>

      </div>

      <div class="bg-surface-container-low px-8 py-5 border-t border-surface-variant">
        <p class="text-xs font-semibold text-on-surface-variant mb-2 flex items-center gap-1.5">
          <span class="material-symbols-outlined text-sm text-surface-tint">info</span>查询须知
        </p>
        <ul class="text-xs text-on-surface-variant space-y-1 list-disc pl-4">
          <li>请输入正确的姓名、准考证号。</li>
          <li>如因特殊原因无法查询，请联系所在学校或当地教育考试机构。</li>
          <li>如遇网络拥堵，请避开高峰期查询。</li>
        </ul>
      </div>

    </div>
  </div>
</main>

<footer class="bg-surface-container-low border-t border-outline-variant w-full py-6 px-6 flex flex-col items-center gap-2 mt-auto">
  <div class="flex gap-5">
    <a class="text-xs text-on-surface-variant hover:text-primary transition-colors" href="#">隐私政策</a>
    <a class="text-xs text-on-surface-variant hover:text-primary transition-colors" href="#">使用条款</a>
    <a class="text-xs text-on-surface-variant hover:text-primary transition-colors" href="#">联系我们</a>
  </div>
  <p class="text-xs text-on-surface-variant text-center">© 2026 教育考试院 版权所有 | 官方咨询电话：010-8888-8888</p>
</footer>

<script>
  let currentCaptcha = '';

  function genCaptcha() {
    const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    return Array.from({length:4}, () => c[Math.floor(Math.random()*c.length)]).join('');
  }

  function refreshCaptcha() {
    currentCaptcha = genCaptcha();
    document.getElementById('captchaText').textContent = currentCaptcha;
    document.getElementById('captcha').value = '';
  }

  async function handleQuery() {
    const name = document.getElementById('name').value.trim();
    const examId = document.getElementById('examId').value.trim();
    const cap = document.getElementById('captcha').value.trim().toUpperCase();
    const btn = document.getElementById('submitBtn');

    hideError();

    if (!name || !examId) { showError('请填写姓名和准考证号'); return; }
    if (!cap) { showError('请填写验证码'); return; }
    if (cap !== currentCaptcha) {
      showError('验证码错误，请重新输入');
      refreshCaptcha();
      const inp = document.getElementById('captcha');
      inp.classList.add('shake');
      setTimeout(() => inp.classList.remove('shake'), 400);
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined spin text-xl">progress_activity</span> 查询中…';

    try {
      const res = await fetch(`/api/query?name=${encodeURIComponent(name)}&examId=${encodeURIComponent(examId)}`);
      const data = await res.json();
      if (!res.ok) {
        showError(data.error || '查询失败，请重试');
        refreshCaptcha();
      } else {
        sessionStorage.setItem('queryResult', JSON.stringify(data.student));
        window.location.href = '/result';
      }
    } catch {
      showError('网络异常，请稍后重试');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined text-xl">search</span> 查询成绩';
    }
  }

  function showError(msg) {
    const box = document.getElementById('errorBox');
    document.getElementById('errorText').textContent = msg;
    box.classList.remove('hidden'); box.classList.add('flex');
  }
  function hideError() {
    const box = document.getElementById('errorBox');
    box.classList.add('hidden'); box.classList.remove('flex');
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') handleQuery(); });
  refreshCaptcha();
</script>
</body>
</html>
