<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浙江省普通高中学业水平考试成绩单</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  @media print {
    .no-print { display: none !important; }
    body { background: white !important; }
    .print-card { box-shadow: none !important; border: 1px solid #e0e3e5 !important; }
    header { display: none !important; }
  }
</style>
<script>
  tailwind.config = {
    theme: { extend: { colors: {
      "background":"#f8f9fb","surface-bright":"#f8f9fb","surface":"#f8f9fb",
      "surface-container-lowest":"#ffffff","surface-container-low":"#f2f4f6",
      "surface-container":"#eceef0","surface-variant":"#e0e3e5",
      "outline-variant":"#c4c6cf","outline":"#74777f",
      "primary":"#002046","primary-container":"#1b365d",
      "on-primary":"#ffffff","on-surface":"#191c1e","on-surface-variant":"#44474e",
      "secondary-fixed":"#ffdea5","secondary":"#775a19","error":"#ba1a1a"
    }}}
  }
</script>
</head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col">

<!-- 顶部导航 -->
<header class="bg-primary text-white fixed top-0 w-full z-50 flex justify-between items-center px-4 py-4 border-b-2 border-secondary-fixed shadow-sm no-print">
  <div class="flex items-center gap-2">
    <button onclick="window.history.back()" class="flex items-center justify-center p-2 rounded-full hover:bg-white/10 transition-colors active:opacity-80">
      <span class="material-symbols-outlined text-white text-xl">arrow_back</span>
    </button>
    <h1 class="font-bold text-white text-base md:text-xl truncate">浙江省普通高中学业水平考试成绩单</h1>
  </div>
  <button onclick="window.print()" class="flex items-center justify-center p-2 rounded-full hover:bg-white/10 transition-colors active:opacity-80">
    <span class="material-symbols-outlined text-white text-xl">print</span>
  </button>
</header>

<!-- 桌面端操作行 -->
<div class="hidden md:flex justify-between items-center max-w-[900px] mx-auto w-full px-8 pt-24 pb-0 no-print">
  <button onclick="window.history.back()"
    class="flex items-center gap-2 px-4 py-2 bg-surface text-on-surface border border-outline-variant rounded-lg text-sm font-semibold hover:bg-surface-variant transition-colors">
    <span class="material-symbols-outlined text-lg">arrow_back</span>返回查询
  </button>
  <button onclick="window.print()"
    class="flex items-center gap-2 px-4 py-2 bg-primary text-white rounded-lg text-sm font-semibold hover:opacity-90 transition-opacity shadow-sm">
    <span class="material-symbols-outlined text-lg">print</span>打印成绩单
  </button>
</div>

<!-- 主内容 -->
<main class="flex-grow pt-20 md:pt-4 pb-8 px-4 max-w-3xl mx-auto w-full">

  <!-- 无数据提示 -->
  <div id="noData" class="hidden mt-8 bg-surface-container-lowest rounded-xl shadow p-12 text-center">
    <span class="material-symbols-outlined text-5xl text-on-surface-variant mb-3 block">search_off</span>
    <p class="text-on-surface font-semibold mb-1">未找到成绩数据</p>
    <p class="text-on-surface-variant text-sm mb-6">请先在查询页面输入考生信息</p>
    <a href="/" class="inline-block bg-primary text-white px-6 py-2.5 rounded-lg text-sm font-semibold hover:opacity-90 transition-opacity">返回查询</a>
  </div>

  <!-- 成绩卡片 -->
  <div id="resultCard" class="hidden bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] overflow-hidden print-card border border-outline-variant/30 mt-6 md:mt-0">

    <!-- 卡片头部 -->
    <div class="bg-primary px-6 py-6 border-b-2 border-secondary">
      <div class="flex justify-between items-start md:items-center flex-col md:flex-row gap-3">
        <h2 id="cardTitle" class="font-bold text-white text-lg md:text-2xl"></h2>
        <div class="bg-white/10 border border-white/20 px-4 py-2 rounded-lg text-right flex-shrink-0">
          <span class="text-white/65 text-xs block">准考证号</span>
          <span id="cardExamId" class="text-white font-mono font-bold text-sm md:text-base tracking-wider"></span>
        </div>
      </div>
    </div>

    <!-- 考生信息 -->
    <div class="px-6 py-5 border-b border-surface-variant">
      <div class="grid grid-cols-2 gap-y-4 gap-x-8">
        <div class="flex flex-col gap-1">
          <span class="text-xs text-on-surface-variant">姓名</span>
          <span id="infoName" class="text-on-surface font-semibold text-sm"></span>
        </div>
        <!-- 自动生成标记（仅在自动生成时显示） -->
        <div id="autoTag" class="hidden flex-col gap-1 items-end">
          <span class="inline-flex items-center gap-1 text-xs bg-surface-container text-on-surface-variant px-2 py-1 rounded-full">
            <span class="material-symbols-outlined text-xs">auto_awesome</span>首次查询
          </span>
        </div>
        <div class="flex flex-col gap-1 col-span-2">
          <span class="text-xs text-on-surface-variant">准考证号</span>
          <span id="infoExamId" class="text-on-surface font-medium text-sm tracking-wide font-mono"></span>
        </div>
      </div>
    </div>

    <!-- 成绩表格 -->
    <div class="p-6">
      <h3 class="text-sm font-semibold text-primary mb-4 pb-2 border-b border-surface-variant flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-lg">school</span>科目成绩
      </h3>
      <div class="overflow-hidden rounded-lg border border-outline-variant">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-surface-container-low text-on-surface-variant text-xs font-semibold border-b border-outline-variant">
              <th class="py-3 px-4">科目</th>
              <th class="py-3 px-4 text-right">成绩分数</th>
            </tr>
          </thead>
          <tbody id="scoresBody" class="text-sm text-on-surface"></tbody>
        </table>
      </div>
    </div>

    <!-- 底部说明 -->
    <div class="bg-surface-container-low p-6 border-t border-surface-variant text-center">
      <p class="text-xs text-on-surface-variant">此成绩单由浙江省教育考试院权威发布</p>
    </div>

  </div>

  <!-- 手机端按钮 -->
  <div id="mobileActions" class="hidden mt-6 flex-col gap-3 no-print">
    <button onclick="window.print()"
      class="w-full bg-primary text-white font-semibold py-4 rounded-full flex items-center justify-center gap-2 text-sm shadow-sm hover:opacity-90 transition-opacity">
      <span class="material-symbols-outlined">print</span>打印成绩单
    </button>
    <button onclick="window.location.href='/'"
      class="w-full bg-surface text-on-surface border border-outline-variant font-semibold py-4 rounded-full flex items-center justify-center gap-2 text-sm hover:bg-surface-variant transition-colors">
      <span class="material-symbols-outlined">arrow_back</span>返回查询首页
    </button>
  </div>

</main>

<!-- 页脚 -->
<footer class="bg-surface-container-low w-full py-8 px-6 flex flex-col items-center gap-2 border-t border-outline-variant mt-auto no-print">
  <div class="flex gap-4 mb-1">
    <a class="text-xs text-on-surface-variant hover:text-primary transition-colors" href="#">隐私政策</a>
    <a class="text-xs text-on-surface-variant hover:text-primary transition-colors" href="#">使用条款</a>
    <a class="text-xs text-on-surface-variant hover:text-primary transition-colors" href="#">联系我们</a>
  </div>
  <p class="text-xs text-on-surface-variant text-center">© 2026 教育考试院 版权所有<br>官方咨询电话：010-8888-8888</p>
</footer>

<script>
  window.addEventListener('load', () => {
    const raw = sessionStorage.getItem('queryResult');
    if (!raw) { document.getElementById('noData').classList.remove('hidden'); return; }

    const s = JSON.parse(raw);
    document.getElementById('resultCard').classList.remove('hidden');
    const mob = document.getElementById('mobileActions');
    mob.classList.remove('hidden'); mob.classList.add('flex');

    document.getElementById('cardTitle').textContent = `${s.name}的学业考试成绩`;
    document.getElementById('cardExamId').textContent = s.examId;
    document.getElementById('infoName').textContent = s.name;
    document.getElementById('infoExamId').textContent = s.examId;
    document.title = `${s.name}的成绩单`;

    if (s.autoGenerated) {
      const tag = document.getElementById('autoTag');
      tag.classList.remove('hidden'); tag.classList.add('flex');
    }

    const tbody = document.getElementById('scoresBody');
    const scores = s.scores || {};
    let i = 0;
    for (const [sub, score] of Object.entries(scores)) {
      const bg = i % 2 === 1 ? 'bg-surface-container-low/30' : '';
      const isLast = i === Object.keys(scores).length - 1;
      const border = isLast ? '' : 'border-b border-surface-variant';
      tbody.innerHTML += `
        <tr class="${border} ${bg}">
          <td class="py-4 px-4 font-medium">${sub}</td>
          <td class="py-4 px-4 text-right font-bold text-primary text-base">${score}</td>
        </tr>`;
      i++;
    }
  });
</script>
</body>
</html>
